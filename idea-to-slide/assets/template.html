<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{DECK_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBFBF8; --ink:#1B2230; --graphite:#6B7380; --mist:#E3E6EA; --rule:#C9CED5;
  --hl:#2E4A85; --on-hl:#FFFFFF; --blue:#2E4A85; --surround:#D7DBE0;
  --display:"Lora","Georgia","Times New Roman",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181C23; --ink:#ECEEF1; --graphite:#9AA2AD; --mist:#262C35; --rule:#3A414C;
    --hl:#3D5FA8; --on-hl:#FFFFFF; --blue:#9DB4E6; --surround:#0E1116;
  }
}
:root[data-theme="dark"]{
  --paper:#181C23; --ink:#ECEEF1; --graphite:#9AA2AD; --mist:#262C35; --rule:#3A414C;
  --hl:#3D5FA8; --on-hl:#FFFFFF; --blue:#9DB4E6; --surround:#0E1116;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--surround);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;position:relative;overflow:hidden;min-height:0}
.deck{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--paper);padding:56px 72px 40px;display:flex;flex-direction:column;box-shadow:0 2px 24px rgba(20,25,35,.18)}
.slide[hidden]{display:none}
h2{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.15;letter-spacing:0;margin:0 0 36px;max-width:1136px;text-wrap:balance}
.body{flex:1;min-height:0}
.src{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--graphite);border-top:1px solid var(--rule);padding-top:14px;margin-top:20px}
h3{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 14px;color:var(--ink)}
p{margin:0}
.muted{color:var(--graphite)}
.hl{background:var(--hl);color:var(--on-hl)}

/* slide 1 */
.s1{display:grid;grid-template-columns:5fr 7fr;gap:56px;height:100%}
.pyr text{font-family:var(--body);font-size:15px}
.f-hl{fill:var(--hl)} .f-mist{fill:var(--mist)} .f-paper{fill:var(--paper)} .s-rule{stroke:var(--rule)}
.t-ink{fill:var(--ink)} .t-onhl{fill:var(--on-hl)} .t-gr{fill:var(--graphite)}
.scqa{display:grid;grid-template-columns:52px 150px 1fr;row-gap:0}
.scqa > div{padding:16px 0;border-bottom:1px solid var(--rule);font-size:21px;line-height:1.35;display:flex;align-items:center}
.scqa .l{font-family:var(--display);font-weight:700;font-size:30px}
.scqa .k{color:var(--graphite);font-size:17px}
.scqa .row-a{background:var(--hl);color:var(--on-hl)}
.scqa .row-a.k{color:var(--on-hl)}
.scqa .row-a:first-child{padding-left:10px}
.scqa .l.row-a{padding-left:12px}
.note{margin-top:22px;font-size:19px;line-height:1.45;max-width:620px}

/* slide 2 */
.s2{display:grid;grid-template-columns:1fr 1fr;gap:56px;height:100%}
.titlecard{border:1px solid var(--rule);padding:20px 24px;margin-bottom:18px;background:var(--paper)}
.titlecard .tag{font-size:15px;color:var(--graphite);margin-bottom:8px}
.titlecard .t{font-family:var(--display);font-size:26px;line-height:1.2;font-weight:500}
.titlecard.weak .t{color:var(--graphite)}
.titlecard.strong{border-left:8px solid var(--hl)}
.checks{display:grid;gap:14px;margin-top:8px}
.checks div{font-size:19px;line-height:1.4}
.checks b{font-weight:600}
.ghost{display:flex;flex-direction:column;gap:10px}
.strip{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;font-size:18px;line-height:1.3;padding:12px 14px;background:var(--mist)}
.strip span:first-child{font-family:var(--display);font-weight:700;font-size:20px;color:var(--graphite)}
.ghostq{margin-top:18px;font-size:20px;line-height:1.4}

/* slide 3 */
.s3{display:grid;grid-template-columns:6fr 5fr;gap:52px;height:100%}
table{border-collapse:collapse;width:100%;font-size:18px}
th{text-align:left;font-weight:600;font-size:15px;color:var(--graphite);padding:0 10px 10px 0;border-bottom:2px solid var(--ink)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.3}
td:first-child{font-style:italic}
.chart text{font-family:var(--body)}
.rules{margin-top:18px;display:grid;gap:10px;font-size:18px;line-height:1.4}
.illus{font-size:14px;color:var(--graphite)}

/* slide 4 */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:34px}
.step{position:relative;padding:16px 28px 16px 20px;background:var(--mist);margin-right:22px}
.step .n{font-family:var(--display);font-weight:700;font-size:15px;color:var(--graphite)}
.step .h{font-family:var(--display);font-weight:700;font-size:24px;margin:2px 0 4px}
.step .d{font-size:16px;line-height:1.35;color:var(--ink)}
.step.last{background:var(--hl);color:var(--on-hl);margin-right:0}
.step.last .d,.step.last .n{color:var(--on-hl)}
.arrow{position:absolute;right:-20px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--graphite)}
.s4{display:grid;grid-template-columns:7fr 5fr;gap:52px}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.thumb svg{width:100%;height:auto;display:block;margin-bottom:8px}
.thumb p{font-size:15px;line-height:1.3}
.thumb p b{display:block;font-weight:600;font-size:16px}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule)}
.split > div{padding:16px 18px}
.split > div + div{border-left:1px solid var(--rule);background:var(--mist)}
.split h4{font-family:var(--display);font-size:20px;margin:0 0 8px}
.split p{font-size:16px;line-height:1.4}
.start{margin-top:16px;font-size:18px;line-height:1.4}

nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 12px;font-family:var(--body);color:var(--ink)}
nav button{font:inherit;font-size:15px;padding:8px 16px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;min-width:96px}
nav button:disabled{opacity:.4;cursor:default}
nav button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#count{font-size:15px;min-width:52px;text-align:center;color:var(--graphite)}
</style>

<style>
.thanks{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:6px}
.thanks div{border-top:4px solid var(--ink);padding-top:16px}
.thanks h4{font-family:var(--display);font-size:24px;margin:0 0 8px}
.thanks p{font-size:19px;line-height:1.4;color:var(--graphite)}
.answer{margin-top:44px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.answer .tagl{font-size:17px;color:var(--graphite)}
.answer .big{font-family:var(--display);font-weight:700;font-size:34px;padding:12px 20px;background:var(--hl);color:var(--on-hl)}
.demo{border:2px dashed var(--rule);height:100%;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.demo .h{font-family:var(--display);font-weight:700;font-size:26px;margin-bottom:8px}
.demo p{font-size:16px;color:var(--graphite);max-width:300px;line-height:1.4}
.ba{display:grid;grid-template-columns:1fr 150px 1fr;gap:0;height:100%}
.panel{padding:20px 22px;border:1px solid var(--rule)}
.panel.before{background:var(--mist)}
.panel .cap{font-size:15px;color:var(--graphite);margin-bottom:12px}
.bubble{background:var(--paper);border:1px solid var(--rule);padding:10px 14px;margin-bottom:10px;font-size:16px;line-height:1.35}
.bubble .meta{display:block;font-size:13px;color:var(--graphite);margin-top:4px}
.lever{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 10px}
.lever .arr{font-size:44px;line-height:1;color:var(--ink)}
.lever p{font-size:16px;line-height:1.3;margin-top:6px;font-weight:600}
.skillname{font-family:var(--display);font-weight:700;font-size:24px;margin-bottom:4px}
.skilldesc{font-size:15px;color:var(--graphite);margin-bottom:14px}
.branch{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--rule);padding:10px 0;font-size:16px;line-height:1.35}
.branch b{font-weight:600}
.branch .mk{color:var(--blue);font-weight:600;border-bottom:2px solid var(--blue)}
.ex{display:grid;grid-template-columns:150px repeat(3,1fr);column-gap:22px}
.ex > div{padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.4}
.ex .rl{font-size:15px;color:var(--graphite);font-weight:600}
.ex .hd{border-bottom:2px solid var(--ink);padding-bottom:10px}
.ex .hd .lvl{font-size:14px;color:var(--graphite);display:block;margin-bottom:4px}
.ex .hd .nm{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.15}
.ex .first{background:var(--hl);color:var(--on-hl);padding-left:12px;padding-right:12px}
.ex .first .lvl{color:var(--on-hl)}
.diff{display:flex;gap:4px;margin-top:6px}
.diff i{display:block;width:22px;height:6px;background:var(--rule)}
.diff i.on{background:var(--ink)}
.ex .first .diff i.on{background:var(--on-hl)}
</style>
<style>
.cio{display:grid;grid-template-columns:4.4fr 46px 3fr 46px 3.6fr;align-items:stretch;height:100%}
.col{border:1px solid var(--rule);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.col > h3{margin:0;font-size:24px;font-weight:700}
.sub{border-top:1px solid var(--rule);padding-top:12px;flex:1}
.sub h4{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--graphite)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px}
.cio svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flowarr{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--graphite)}
.icard{flex:1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--mist);font-family:var(--display);font-size:22px;font-weight:700}
.icard.on{background:var(--hl);color:var(--on-hl)}
.icard.on svg{stroke:var(--on-hl)}
.icard small{display:block;font-family:var(--body);font-weight:400;font-size:14px}
.orow{flex:1;display:flex;align-items:center;gap:14px;border-top:1px solid var(--rule);font-size:18px}
.c2{display:grid;grid-template-columns:200px 1fr 1fr;column-gap:24px}
.c2 > div{padding:16px 0;border-bottom:1px solid var(--rule);font-size:20px;line-height:1.35}
.c2 .hd{font-family:var(--display);font-weight:700;font-size:24px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.c2 .rl{font-size:16px;font-weight:600;color:var(--graphite)}
.c2 .now{color:var(--graphite)}
.how{margin-top:30px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.how .tagl{font-size:17px;color:var(--graphite)}
.how .big{font-size:24px;padding:12px 18px;background:var(--hl);color:var(--on-hl);font-weight:500}
</style>
<style>
.tl{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:84px}
.tl::before{content:"";position:absolute;left:12px;right:12px;top:15px;height:3px;background:var(--rule)}
.tl::after{content:"";position:absolute;left:12px;width:calc(50% + 12px);top:15px;height:3px;background:var(--ink)}
.node{position:relative;z-index:1}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);background:var(--ink);margin-bottom:18px}
.node.today .dot{background:var(--hl);border-color:var(--ink);width:40px;height:40px;margin-top:-4px;margin-bottom:14px}
.node.next .dot{background:var(--paper);border-color:var(--rule)}
.node .when{font-size:15px;color:var(--graphite);margin-bottom:4px}
.node .what{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin-bottom:8px}
.node p{font-size:18px;line-height:1.4;color:var(--graphite)}
.node.today .card{background:var(--hl);color:var(--on-hl);padding:14px 16px;margin:-14px -16px 0}
.node.today .card p,.node.today .card .when{color:var(--on-hl)}
.node.next .what{color:var(--graphite)}
.thx{margin-top:auto;font-size:18px;color:var(--graphite);line-height:1.4}
.s-intro{display:flex;flex-direction:column;height:100%}
</style>
<style>
.cover{padding:0;flex-direction:row}
.cover .band{width:28px;background:var(--hl);flex:none}
.cover .inner{flex:1;padding:72px 88px 56px;display:flex;flex-direction:column}
.cover .org{font-size:20px;font-weight:600;color:var(--blue)}
.cover h1{font-family:var(--display);font-weight:600;font-size:72px;line-height:1.08;margin:auto 0 28px;max-width:960px;text-wrap:balance}
.cover .tagline{font-size:24px;color:var(--graphite);max-width:820px;line-height:1.4}
.cover .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--rule);padding-top:20px}
.cover .who{font-family:var(--display);font-size:24px;font-weight:600}
.cover .date{font-size:18px;color:var(--graphite)}
</style>
</head><body>
<div class="wrap" id="wrap">
<div class="deck" id="deck">

<!-- {{SLIDES}}: one <section class="slide" aria-label="Slide N"> per slide.
     First slide has no `hidden` attribute; every other slide has `hidden`.
     Each content slide: <h2> action title, <div class="body ...">, <div class="src"> footer. -->

</div>
</div>
<nav aria-label="Slide navigation">
  <button id="prev" type="button">Previous</button>
  <span id="count" aria-live="polite">1 / {{N}}</span>
  <button id="next" type="button">Next</button>
</nav>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var deck=document.getElementById('deck'), wrap=document.getElementById('wrap');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), count=document.getElementById('count');
  var i=0;
  try{var saved=parseInt(localStorage.getItem('deck-i'),10); if(!isNaN(saved)) i=saved;}catch(e){}
  function show(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach(function(s,k){s.hidden=(k!==i);});
    count.textContent=(i+1)+' / '+slides.length;
    prev.disabled=(i===0); next.disabled=(i===slides.length-1);
    try{localStorage.setItem('deck-i',String(i));}catch(e){}
  }
  function fit(){
    var s=Math.min(wrap.clientWidth/1280, wrap.clientHeight/720)*0.96;
    deck.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  prev.addEventListener('click',function(){show(i-1);});
  next.addEventListener('click',function(){show(i+1);});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();show(i+1);}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(i-1);}
  });
  var x0=null;
  wrap.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  wrap.addEventListener('touchend',function(e){
    if(x0===null)return; var dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>50) show(dx<0?i+1:i-1); x0=null;
  });
  window.addEventListener('resize',fit);
  show(i); fit();
})();
</script>
</body>
</html>
